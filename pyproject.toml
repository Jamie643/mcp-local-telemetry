[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-local-telemetry"
version = "0.1.0"
description = "A lightweight MCP server that feeds local system telemetry to AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jamie643" }]
keywords = ["mcp", "model-context-protocol", "telemetry", "psutil", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["psutil>=5.9,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mcp-local-telemetry = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/Jamie643/mcp-local-telemetry"
Issues = "https://github.com/Jamie643/mcp-local-telemetry/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["mcp_server.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q --cov=mcp_server --cov-report=term-missing"
testpaths = ["tests"]
